                <input type="number" id="daysInput" required> 

                <p id="questionLabels">Candle Goal</p>
                <input type="number" id="candGoalInput" required>

                <p id="questionLabels">Current amount of Candles</p>
                <input type="number" id="currentCandInput" required> <br> <br>
            </form>
