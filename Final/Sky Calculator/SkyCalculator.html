<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=menu" />
        <link href="./sky-styles.css" rel="stylesheet">
        <script src="./sky-script.js"></script>

        <title>Sky Calculator</title>
    </head>

    <body>

        <!--NAVIGATION BEGIN-->
        <div class="navButtons">
            <button id="aboutTab" class="active" onClick="updateTabs(this.id)">About</button>
            <button id="calcTab" onClick="updateTabs(this.id)">Calculator</button>
            <button id="three-btn" onClick="updateTabs(this.id)">DIV THREE</button>
        </div> 
        <!--NAVIGATION END-->


        <div class="container">

            <header>
                <h1>Sky Calculator</h1>
            </header>

            <div id="aboutPage">
                <h2>About</h2>

                <p id="aboutContent">lorem ipsum dolorem stuff here talking about what the calculator is and how to use it</p>
            </div> 

            <div id="calcPage">
                <h2>Candle Calculator</h2>
            
                <div class="calculator">

                    <form class="inputGroup">
                        <p id="questionLabels">Number of Daily Heart Trades</p>
                        <input type="number" id="tradesInput" required>

                        <p id="questionLabels">Days left until Deadline</p>
                        <input type="number" id="daysInput" required> 

                        <p id="questionLabels">Candle Goal</p>
                        <input type="number" id="candGoalInput" required>

                        <p id="questionLabels">Current amount of Candles</p>
                        <input type="number" id="currentCandInput" required> 
                    </form>

                    <!--
                    <p>Number of Daily Heart Trades</p>
                    <input type="number" id="tradesInput" required>

                    <p>Days left until Deadline</p>
                    <input type="number" id="daysInput" required> 

                    <p>Candle Goal</p>
                    <input type="number" id="candGoalInput" required>

                    <p>Current amount of Candles</p>
                    <input type="number" id="currentCandInput" required> <br> <br>
                    -->

                    <div id="submit">
                        <button onclick="calculate()"> Submit </button>
                    </div>

                    <div id="output">
                        <h1 id="message"> </h1>
                    </div>

                </div>

            </div> 


            <div id="three"><h2>DIV THREE</h2></div> 
    
        </div> 
        

        <script src="./sky-script.js"></script>

    </body>
</html>
